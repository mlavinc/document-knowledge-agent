name: Build AWS Lambda images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api-gateway/**"
      - "rag-core/**"
      - "infra/environments/prod/**"
      - ".github/workflows/deploy-aws-images.yml"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: rag-core
            repository: rag-agent-rag-core
          - context: api-gateway
            repository: rag-agent-api-gateway

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::866726122809:role/rag-agent-github-image-builder
          aws-region: sa-east-1
          allowed-account-ids: "866726122809"

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Lambda image
        uses: docker/build-push-action@v7.2.0
        with:
          context: ${{ matrix.context }}
          target: lambda
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ matrix.repository }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ matrix.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.repository }}
          cache-to: type=gha,mode=max,scope=${{ matrix.repository }}
